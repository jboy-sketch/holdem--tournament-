<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Texas Hold'em V3.2</title>
<style>
body{margin:0;background:#07120e;color:#fff;font-family:Arial,sans-serif}.app{max-width:1000px;margin:auto;padding:8px}.top{display:flex;justify-content:space-between}.tables{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wrap,.panel{background:#12221b;padding:8px;border-radius:14px;margin-top:8px}.table{height:310px;position:relative;background:radial-gradient(circle,#087044,#043a25);border:7px solid #58351f;border-radius:48%;overflow:hidden}.seat{position:absolute;transform:translate(-50%,-50%);width:70px;padding:4px;background:#14221e;border:1px solid #71857b;border-radius:8px;text-align:center;font-size:9px}.you{border:2px solid #f2c54a}.fold{opacity:.35}.turn{box-shadow:0 0 0 2px #f2c54a}.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;width:95%}.card{display:inline-flex;width:27px;height:39px;background:#fff;color:#111;border-radius:5px;margin:2px;align-items:center;justify-content:center;font-weight:bold}.red{color:#c21d2d}.pot{font-weight:bold}.small{font-size:10px;color:#b7c7c0}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.actions button{padding:12px;border:0;border-radius:10px;font-weight:bold}.foldbtn{background:#d44;color:white}.allbtn{background:#f2c54a}.raise{display:flex;gap:6px;margin-top:7px}.raise input{width:100%}.msg{text-align:center;color:#f2c54a;font-weight:bold;min-height:20px}.log{font-size:10px;color:#9aaca4;max-height:60px;overflow:auto}.start{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px}.box{background:#14231c;border-radius:20px;padding:20px;max-width:450px}.box button{display:block;width:100%;margin:7px 0;padding:13px;border:0;border-radius:10px;text-align:left;font-weight:bold}
@media(max-width:700px){.tables{grid-template-columns:1fr}.table{height:250px}}
</style><div id="app"></div><script>
const R="23456789TJQKA",S="♠♥♦♣",N=["YOU","Mike","Tom","Sarah","Dave","Linda","Chris","Rob","Karen","Steve","Lisa","Mark","Tony","Mary","Bill","Nancy","Frank","Joe"],L=[[100,200,200],[150,300,300],[200,400,400],[300,600,600],[500,1000,1000],[750,1500,1500],[1000,2000,2000]];
let G=null,mode="mixed",clock;
const $=n=>"$"+Math.round(n).toLocaleString(),D=()=>{let d=[];for(let s=0;s<4;s++)for(let r=0;r<13;r++)d.push({r,s});return d.sort(()=>Math.random()-.5)};
function start(){clearInterval(clock);let p=N.map((n,i)=>({id:i,name:n,chips:30000,hand:[],fold:false,all:false,out:false,bet:0,total:0,skill:i?Math.floor(Math.random()*5):5,ai:i>0,table:i<9?1:2}));G={p,level:0,at:Date.now(),merged:false,t1:T(1,p.slice(0,9)),t2:T(2,p.slice(9)),msg:"",log:[]};hand(G.t1);hand(G.t2);clock=setInterval(tick,1000);render()}
function T(num,p){return{num,p,deck:[],board:[],pot:0,bet:0,turn:null,street:"preflop",dealer:0,no:0,active:false}}
function live(t){return t.p.filter(x=>!x.out)}function inhand(t){return t.p.filter(x=>!x.out&&!x.fold)}function actors(t){return t.p.filter(x=>!x.out&&!x.fold&&!x.all)}
function post(t,p,n){let v=Math.min(n,p.chips);p.chips-=v;p.bet+=v;p.total+=v;t.pot+=v;if(!p.chips)p.all=true}
function next(t,id){let a=actors(t);if(!a.length)return null;let i=t.p.findIndex(x=>x.id==id);for(let k=1;k<=t.p.length;k++){let p=t.p[(i+k)%t.p.length];if(!p.out&&!p.fold&&!p.all)return p.id}return null}
function hand(t){let a=live(t);if(a.length<2){t.active=false;return}t.active=true;t.no++;t.deck=D();t.board=[];t.pot=0;t.bet=0;t.street="preflop";t.p.forEach(p=>{p.hand=[];p.fold=p.out;p.all=false;p.bet=0;p.total=0});let di=a.findIndex(p=>p.id==t.dealer);if(di<0)di=0;for(let i=0;i<a.length;i++){let p=a[(di+i)%a.length];p.hand=[t.deck.pop(),t.deck.pop()]}let sb=a[(di+1)%a.length],bb=a[(di+2)%a.length],q=L[G.level];post(t,sb,q[0]);post(t,bb,q[1]);post(t,sb,q[2]);t.bet=q[1];t.turn=next(t,bb.id);ai(t)}
function eval5(c){let r=c.map(x=>x.r).sort((a,b)=>b-a),cnt={};r.forEach(x=>cnt[x]=(cnt[x]||0)+1);let f=c.every(x=>x.s==c[0].s),u=[...new Set(r)];if(u.includes(12))u.push(-1);let st=-1;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]==4)st=u[i];let g=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);if(f&&st>=0)return[8,st];if(+g[0][1]==4)return[7,+g[0][0]];if(+g[0][1]==3&&+g[1][1]>=2)return[6,+g[0][0]];if(f)return[5,...r];if(st>=0)return[4,st];if(+g[0][1]==3)return[3,+g[0][0],...r];if(+g[0][1]==2&&+g[1][1]==2)return[2,+g[0][0],+g[1][0],...r];if(+g[0][1]==2)return[1,+g[0][0],...r];return[0,...r]}
function rank(c){if(c.length<5)return[0];let b=[-1];for(let a=0;a<c.length-4;a++)for(let d=a+1;d<c.length-3;d++)for(let e=d+1;e<c.length-2;e++)for(let f=e+1;f<c.length-1;f++)for(let g=f+1;g<c.length;g++){let v=eval5([c[a],c[d],c[e],c[f],c[g]]);if(v.join()>b.join())b=v}return b}
function done(t){let a=inhand(t),x=actors(t);if(a.length<=1||!x.length)return true;let m=Math.max(...a.map(p=>p.bet));return x.every(p=>p.bet==m)}
function ai(t){if(!t.active||t.turn==null)return;let p=t.p.find(x=>x.id==t.turn);if(!p){street(t);return}if(!p.ai)return;setTimeout(()=>{if(!t.active||t.turn!=p.id||p.out||p.fold||p.all)return;let need=Math.max(0,t.bet-p.bet),pair=p.hand[0].r==p.hand[1].r,high=Math.max(...p.hand.map(x=>x.r))/12,s=(pair?.5:0)+high,thr=[.35,.43,.52,.61,.69][p.skill]||.5;let a=need&&s<thr&&Math.random()<.7?"fold":s>thr+.15&&Math.random()<.35?"raise":need?"call":"check";if(a=="raise")act(t,p.id,"raise",Math.min(p.bet+p.chips,t.bet+L[G.level][1]*(p.skill>2?2:1)));else act(t,p.id,a,0)},250+Math.random()*400)}
function act(t,id,a,amt){let p=t.p.find(x=>x.id==id);if(!t.active||!p||p.out||p.fold||p.all)return;let need=Math.max(0,t.bet-p.bet);if(a=="fold")p.fold=true;else if(a=="check"){if(need)return}else if(a=="call")post(t,p,need);else if(a=="raise"){let target=Math.min(p.bet+p.chips,Math.max(t.bet+L[G.level][1],amt));post(t,p,target-p.bet);t.bet=Math.max(t.bet,p.bet)}if(done(t)){street(t);return}t.turn=next(t,p.id);if(t.turn==null)street(t);else{ai(t);render()}}
function street(t){if(!t.active)return;let a=inhand(t);if(a.length==1)return finish(t,a);if(t.street=="river")return finish(t,a);if(t.street=="preflop"){t.board.push(t.deck.pop(),t.deck.pop(),t.deck.pop());t.street="flop"}else{t.board.push(t.deck.pop());t.street=t.street=="flop"?"turn":"river"}t.p.forEach(p=>p.bet=0);t.bet=0;let x=actors(t);if(!x.length){if(t.street=="river")finish(t,a);else setTimeout(()=>street(t),120);return}t.turn=next(t,t.dealer)||x[0].id;ai(t);render()}
function finish(t,a){let ranks=a.map(p=>({p,r:rank(p.hand.concat(t.board))})).sort((x,y)=>y.r.join().localeCompare(x.r.join()));let w=ranks[0]?.p;if(w){w.chips+=t.pot||0}t.p.forEach(p=>{if(!p.out&&p.chips<=0){p.out=true;G.log.unshift(p.name+" eliminated")}});t.pot=0;t.active=false;G.msg=(w?w.name:"Player")+" wins Table "+t.num;setTimeout(()=>{if(!G.merged&&G.p.filter(p=>!p.out).length==9)merge();else if(live(t).length>1){let a=live(t),i=a.findIndex(p=>p.id==t.dealer);t.dealer=a[(i+1)%a.length].id;hand(t)}render()},600)}
function merge(){if(G.merged)return;let a=G.p.filter(p=>!p.out);if(a.length!=9)return;G.merged=true;G.t1.p=a;G.t2.p=[];a.forEach(p=>p.table=1);G.msg="FINAL TABLE — 9 PLAYERS";G.log.unshift("Tables merged at 9 players");setTimeout(()=>hand(G.t1),400)}
function tick(){if(!G)return;if(Date.now()-G.at>=1200000){G.level=Math.min(G.level+1,L.length-1);G.at=Date.now();G.log.unshift("Blinds increased") }if(!G.merged&&G.p.filter(p=>!p.out).length==9)merge();render()}
function human(a){if(!G||G.merged||G.t1.turn!=0)return;let p=G.p[0];if(a=="all")act(G.t1,0,"raise",p.bet+p.chips);else act(G.t1,0,a,0)}
function raise(){if(G&&G.t1.turn==0)act(G.t1,0,"raise",+document.getElementById("raise").value)}
function C(c){return'<span class="card '+((c.s==1||c.s==2)?"red":"")+'">'+R[c.r]+S[c.s]+'</span>'}
function tab(t,hero){let s=t.p.map((p,i)=>{if(p.out)return"";let q=i/t.p.length*Math.PI*2-Math.PI/2;return'<div class="seat '+(p.id==0?"you ":"")+(p.fold?"fold ":"")+(p.id==t.turn?"turn ":"")+'" style="left:'+(50+43*Math.cos(q))+'%;top:'+(50+39*Math.sin(q))+'%"><b>'+p.name+'</b><br>'+$(p.chips)+'</div>'}).join("");return'<div class="wrap"><b>TABLE '+t.num+' <span style="float:right;color:#f2c54a">'+live(t).length+' players</span></b><div class="table">'+s+'<div class="center"><div class="pot">POT '+$(t.pot)+'</div><div class="small">'+t.street.toUpperCase()+' • HAND '+t.no+'</div><div>'+t.board.map(C).join("")+'</div>'+(!hero?"":"<div>"+G.p[0].hand.map(C).join("")+"</div>")+'</div></div></div>'}
function render(){if(!G){app.innerHTML='<div class="start"><div class="box"><h1>♠ Texas Hold’em V3.2</h1><p>18 players. Two independent tables of 9. $30,000 stacks. $100/$200/$200 starting blinds. Blinds every 20 minutes.</p><p>Each table plays complete hands independently. All-in players stop acting; if everyone is all-in, the remaining board runs automatically to showdown. Tables merge only when 9 players remain.</p>'+["BEGINNER","RECREATIONAL","INTERMEDIATE","ADVANCED","EXPERT","MIXED"].map(x=>'<button onclick="mode=\''+x.toLowerCase()+'\';start()">'+x+' AI FIELD</button>').join("")+'</div></div>';return}let p=G.p[0],t=G.t1,turn=!G.merged&&t.turn==0&&!p.out&&!p.fold&&!p.all,need=Math.max(0,t.bet-p.bet),min=Math.min(p.bet+p.chips,t.bet+L[G.level][1]),max=p.bet+p.chips;app.innerHTML='<div class="app"><div class="top"><b>♠ Hold’em V3.2</b><div class="small">'+G.p.filter(p=>!p.out).length+'/18 players<br>Level '+(G.level+1)+' • '+L[G.level][0]+'/'+L[G.level][1]+'</div></div><div class="tables">'+tab(G.t1,true)+(G.merged?"":tab(G.t2,false))+'</div><div class="panel"><div class="msg">'+(G.merged?"FINAL TABLE — 9 PLAYERS":turn?"YOUR TURN":"AI PLAYING — TWO TABLES INDEPENDENTLY")+'</div><div class="actions"><button class="foldbtn" onclick="human(\'fold\')" '+(turn?"":"disabled")+'>FOLD</button><button onclick="human(\'check\')" '+(turn&&!need?"":"disabled")+'>CHECK</button><button onclick="human(\'call\')" '+(turn&&need?"":"disabled")+'>'+(need?"CALL "+$(need):"CHECK")+'</button><button class="allbtn" onclick="human(\'all\')" '+(turn?"":"disabled")+'>ALL-IN</button></div><div class="raise"><input id="raise" type="range" min="'+Math.max(1,min)+'" max="'+Math.max(1,max)+'" value="'+Math.max(1,min)+'" '+(turn?"":"disabled")+'><button onclick="raise()" '+(turn?"":"disabled")+'>RAISE</button></div><div class="small" style="text-align:center;margin-top:5px">Your stack '+$(p.chips)+' • Table 1 '+live(G.t1).length+' • Table 2 '+live(G.t2).length+'<br>'+G.msg+'</div><div class="log">'+G.log.slice(0,7).map(x=>"• "+x).join("<br>")+'</div></div></div>'}
render();
</script>
