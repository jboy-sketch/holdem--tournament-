<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#064d30">
<title>Hold'em Tournament V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07120e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{border:0;border-radius:12px;padding:13px 9px;font-size:15px;font-weight:800;background:#e9ece9;color:#111}button:disabled{opacity:.3}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center;padding:7px 2px}.title{font-size:20px;font-weight:900}.stats{text-align:right;color:#c5d6ce;font-size:11px}
.table{height:57vh;min-height:390px;position:relative;background:radial-gradient(circle,#087044,#043a25);border:9px solid #58351f;border-radius:48%;box-shadow:0 12px 30px #0008;overflow:hidden}
.seat{position:absolute;transform:translate(-50%,-50%);width:94px;padding:6px 4px;background:#14221ddd;border:1px solid #587268;border-radius:10px;text-align:center;font-size:10px;line-height:1.25}.seat.you{border:2px solid #f3c64d}.seat.fold{opacity:.35}.seat.out{display:none}.dealer{background:#fff;color:#111;border-radius:50%;padding:1px 4px;font-size:8px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:94%;text-align:center}.pot{font-weight:900;font-size:18px}.side{font-size:10px;color:#b9cec4}.board,.hole{display:flex;justify-content:center;gap:4px;margin:7px 0}.card{width:39px;height:55px;border-radius:6px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 2px 4px #0006}.red{color:#c31d2c}.hole .card{width:54px;height:73px;font-size:27px}
.panel{background:#12221b;border-radius:16px;margin-top:8px;padding:10px}.turn{text-align:center;color:#f3c64d;font-weight:900;min-height:20px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.actions button:first-child{background:#d94d4d;color:#fff}.actions button:last-child{background:#f3c64d}.raise{display:flex;gap:7px;align-items:center;margin-top:8px}.raise input{width:100%;accent-color:#f3c64d}.raise button{padding:10px 14px}.info{font-size:12px;color:#b8c9c1;text-align:center;margin-top:7px}.log{max-height:85px;overflow:auto;font-size:11px;color:#a9bbb4;margin-top:5px}
.modal{position:fixed;inset:0;background:#000d;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.box{background:#14231c;border-radius:20px;padding:20px;width:min(500px,100%);box-shadow:0 15px 50px #000}.box h1{margin-top:0}.levels{display:grid;gap:8px}.levels button{text-align:left}.levels small{display:block;font-weight:500;color:#444}
</style>
</head>
<body><div id="app"></div>
<script>
const SUITS=['♠','♥','♦','♣'],RANKS=['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const NAMES=['YOU','Mike','Tom','Sarah','Dave','Linda','Chris','Rob','Karen','Steve','Lisa','Mark','Tony','Mary','Bill','Nancy','Frank','Joe'];
const BLINDS=[[100,200,200],[150,300,300],[200,400,400],[300,600,600],[500,1000,1000],[750,1500,1500],[1000,2000,2000],[1500,3000,3000],[2000,4000,4000],[3000,6000,6000],[5000,10000,10000]];
let G=null,timer=null,mode='mixed'; const fmt=n=>n.toLocaleString();
function deck(){let d=[];for(let s=0;s<4;s++)for(let r=0;r<13;r++)d.push({s,r});return d.sort(()=>Math.random()-.5)}
function card(c){return `<div class="card ${(c.s===1||c.s===2)?'red':''}">${RANKS[c.r]}${SUITS[c.s]}</div>`}
function skill(){let x=Math.random();if(mode==='beginner')return x<.8?0:1;if(mode==='expert')return x<.2?2:3;if(mode==='advanced')return 2+Math.floor(Math.random()*2);if(mode==='intermediate')return 1+Math.floor(Math.random()*3);if(mode==='recreational')return Math.floor(Math.random()*3);return x<.15?0:x<.43?1:x<.76?2:x<.95?3:4}
function makeTable(n,ps){return{n,players:ps,dealer:ps[0].id,deck:[],board:[],street:'preflop',pot:0,bet:0,turn:null,hand:0,active:false}}
function start(){clearInterval(timer);let p=NAMES.map((name,id)=>({id,name,chips:30000,hand:[],fold:false,all:false,out:false,bet:0,contrib:0,ai:id>0,skill:id?skill():5,table:id<9?1:2}));G={p,level:0,levelStart:Date.now(),merged:false,msg:'',logs:[],t1:makeTable(1,p.slice(0,9)),t2:makeTable(2,p.slice(9))};newHand(G.t1);newHand(G.t2);timer=setInterval(tick,1000);render()}
function alive(t){return t.players.filter(p=>!p.out)} function elig(t){return t.players.filter(p=>!p.out&&!p.fold)}
function next(t,id,act=true){let a=t.players.filter(p=>!p.out),i=a.findIndex(p=>p.id===id);for(let k=1;k<=a.length;k++){let q=a[(i+k)%a.length];if(!q.out&&(!act||(!q.fold&&!q.all)))return q.id}return null}
function post(t,p,n){let v=Math.min(n,p.chips);p.chips-=v;p.bet+=v;p.contrib+=v;t.pot+=v;if(!p.chips)p.all=true}
function newHand(t){let a=alive(t);if(a.length<2){t.active=false;return}t.active=true;t.hand++;t.deck=deck();t.board=[];t.street='preflop';t.pot=0;t.bet=0;t.players.forEach(p=>{p.hand=[];p.fold=p.out;p.all=false;p.bet=0;p.contrib=0});if(!a.some(p=>p.id===t.dealer))t.dealer=a[0].id;let di=a.findIndex(p=>p.id===t.dealer);for(let i=0;i<a.length;i++){let p=a[(di+i)%a.length];p.hand=[t.deck.pop(),t.deck.pop()]}let b=BLINDS[G.level],sb=a[(di+1)%a.length],bb=a[(di+2)%a.length];post(t,sb,b[0]);post(t,bb,b[1]);post(t,sb,b[2]);t.bet=b[1];t.turn=next(t,bb.id);runAI(t)}
function best(cs){if(cs.length<5)return[0];let best=null;for(let a=0;a<cs.length-4;a++)for(let b=a+1;b<cs.length-3;b++)for(let c=b+1;c<cs.length-2;c++)for(let d=c+1;d<cs.length-1;d++)for(let e=d+1;e<cs.length;e++){let q=[cs[a],cs[b],cs[c],cs[d],cs[e]],rs=q.map(x=>x.r).sort((x,y)=>y-x),ct={};rs.forEach(r=>ct[r]=(ct[r]||0)+1);let u=[...new Set(rs)];if(u.includes(12))u.push(-1);let st=-1;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4)st=u[i];let fl=q.every(x=>x.s===q[0].s),co=Object.entries(ct).sort((x,y)=>y[1]-x[1]||+y[0]-+x[0]),v;if(fl&&st>=0)v=[8,st];else if(co[0][1]===4)v=[7,+co[0][0]];else if(co[0][1]===3&&co[1][1]>=2)v=[6,+co[0][0],+co[1][0]];else if(fl)v=[5,...rs];else if(st>=0)v=[4,st];else if(co[0][1]===3)v=[3,+co[0][0],...rs];else if(co[0][1]===2&&co[1][1]===2)v=[2,+co[0][0],+co[1][0],...rs];else if(co[0][1]===2)v=[1,+co[0][0],...rs];else v=[0,...rs];if(!best||v.join(',')>best.join(','))best=v}return best}
function strength(t,p){let h=p.hand;if(!h.length)return 0;let r=best(h.concat(t.board))[0],hi=Math.max(...h.map(c=>c.r))/12,pair=h[0].r===h[1].r,su=h[0].s===h[1].s,co=Math.abs(h[0].r-h[1].r)<=1;return r>=2?.9:r===1?.68:hi+(pair?.5:0)+(su?.08:0)+(co?.04:0)}
function runAI(t){if(!G||!t.active)return;let p=t.players.find(x=>x.id===t.turn);if(!p||!p.ai||p.out||p.fold||p.all){advance(t);return}setTimeout(()=>{if(!G||!t.active||t.turn!==p.id)return;let need=Math.max(0,t.bet-p.bet),s=strength(t,p),thr=[.34,.45,.56,.67,.77][p.skill]||.55,odds=need/(t.pot+need||1);let a=need&&s<Math.max(thr,odds+.16)&&Math.random()<.78?'fold':(s>thr+.13&&Math.random()<.62?'raise':(need?'call':'check'));if(a==='raise'){let min=t.bet+BLINDS[G.level][1],max=p.bet+p.chips;act(t,p.id,'raise',Math.min(max,Math.max(min,t.bet+BLINDS[G.level][1]*(p.skill>=3?2:1))))}else act(t,p.id,a,0)},250+Math.random()*500)}
function act(t,id,a,amt){let p=t.players.find(x=>x.id===id);if(!p||p.out||p.fold||p.all)return;let need=Math.max(0,t.bet-p.bet);if(a==='fold')p.fold=true;else if(a==='check'){if(need)return}else if(a==='call'){let v=Math.min(need,p.chips);p.chips-=v;p.bet+=v;p.contrib+=v;t.pot+=v;if(!p.chips)p.all=true}else if(a==='raise'){let total=Math.min(p.bet+p.chips,Math.max(t.bet+BLINDS[G.level][1],amt)),v=total-p.bet;if(v<=0)return;p.chips-=v;p.bet+=v;p.contrib+=v;t.pot+=v;t.bet=p.bet;if(!p.chips)p.all=true}advance(t)}
function advance(t){let l=elig(t);if(l.length===1)return award(t,l);let actors=l.filter(p=>!p.all),max=Math.max(...l.map(p=>p.bet));if(!actors.length||actors.every(p=>p.bet===max))return street(t);let n=next(t,t.turn);if(n===null)return street(t);t.turn=n;runAI(t)}
function street(t){let l=elig(t);if(l.length===1)return award(t,l);t.players.forEach(p=>p.bet=0);t.bet=0;if(t.street==='river')return showdown(t);if(t.street==='preflop'){t.board.push(t.deck.pop(),t.deck.pop(),t.deck.pop());t.street='flop'}else{t.board.push(t.deck.pop());t.street=t.street==='flop'?'turn':'river'}let a=l.filter(p=>!p.all);if(!a.length){if(t.street==='river')showdown(t);else setTimeout(()=>street(t),120);return}t.turn=next(t,t.dealer)||a[0].id;runAI(t)}
function pots(t){let v=[...new Set(t.players.filter(p=>p.contrib).map(p=>p.contrib))].sort((a,b)=>a-b),prev=0,o=[];for(let x of v){let ps=t.players.filter(p=>p.contrib>=x),amt=(x-prev)*ps.length;if(amt)o.push({amt,e:ps.filter(p=>!p.out&&!p.fold)});prev=x}return o}
function showdown(t){let l=elig(t);if(l.length===1)return award(t,l);let r=l.map(p=>({p,v:best(p.hand.concat(t.board))})).sort((a,b)=>b.v.join(',').localeCompare(a.v.join(','))),top=r[0].v.join(','),w=r.filter(x=>x.v.join(',')===top).map(x=>x.p);award(t,w)}
function award(t,w){for(let z of pots(t)){let e=z.e.filter(p=>w.includes(p));if(!e.length){let r=z.e.map(p=>({p,v:best(p.hand.concat(t.board))})).sort((a,b)=>b.v.join(',').localeCompare(a.v.join(','))),top=r[0].v.join(',');e=r.filter(x=>x.v.join(',')===top).map(x=>x.p)}let sh=Math.floor(z.amt/e.length);e.forEach(p=>p.chips+=sh);for(let i=0;i<z.amt-sh*e.length;i++)e[i%e.length].chips++}t.players.forEach(p=>{if(!p.out&&!p.chips)p.out=true});t.active=false;if(!G.merged&&remaining()<=9)return merge();setTimeout(()=>{if(alive(t).length>1){t.dealer=next(t,t.dealer,false);newHand(t)}render()},500)}
function remaining(){return G.p.filter(p=>!p.out).length}
function merge(){if(G.merged)return;G.merged=true;let a=G.p.filter(p=>!p.out);G.t1.players=a;G.t2.players=[];a.forEach(p=>p.table=1);G.t1.dealer=a[0]?.id||0;G.t2.active=false;G.t1.active=false;G.msg='FINAL TABLE — 9 PLAYERS';setTimeout(()=>newHand(G.t1),300)}
function tick(){if(!G)return;if(Date.now()-G.levelStart>=1200000){G.level=Math.min(G.level+1,BLINDS.length-1);G.levelStart=Date.now()}if(!G.merged&&remaining()<=9)merge();render()}
function human(a){if(!G||G.merged||G.t1.turn!==0)return;let p=G.p[0];if(a==='all')act(G.t1,0,'raise',p.bet+p.chips);else act(G.t1,0,a,0)}
function humanRaise(){if(G&&G.t1.turn===0)act(G.t1,0,'raise',+document.querySelector('#raise').value)}
function tableHTML(t,num,hero){let seats=t.players.map((p,i)=>{if(p.out)return'';let q=i/Math.max(2,t.players.length)*Math.PI*2-Math.PI/2,x=50+43*Math.cos(q),y=50+39*Math.sin(q);return`<div class="seat ${p.id===0?'you ':''}${p.fold?'fold':''}" style="left:${x}%;top:${y}%"><b>${p.name}</b><br>${fmt(p.chips)}</div>`}).join('');return`<div class="tw"><div class="tt">TABLE ${num}<span class="count">${alive(t).length}</span></div><div class="table">${seats}<div class="center"><div class="pot">Pot ${fmt(t.pot)}</div><div class="side">${t.street.toUpperCase()}</div><div class="board">${t.board.map(card).join('')}</div>${hero?`<div class="hole">${G.p[0].hand.map(card).join('')}</div>`:''}</div></div></div>`}
function render(){if(!G){app.innerHTML=`<div class="modal"><div class="box"><h1>♠ Hold'em V2.1 — Fixed</h1><p><b>18 players start on two tables: 9 + 9.</b></p><p>Tables merge automatically when 9 players remain. The betting engine now advances immediately when all remaining players are all-in or the betting round is complete.</p><div class="levels">${['beginner','recreational','intermediate','advanced','expert','mixed'].map(x=>`<button onclick="mode='${x}';start()"><b>${x==='mixed'?'Mixed Skill Field':x.toUpperCase()}</b><small>Start tournament</small></button>`).join('')}</div></div></div>`;return}let p=G.p[0],b=BLINDS[G.level],turn=!G.merged&&G.t1.turn===0&&!p.out&&!p.fold&&!p.all,need=Math.max(0,G.t1.bet-p.bet),min=Math.min(p.bet+p.chips,G.t1.bet+b[1]),max=p.bet+p.chips;app.innerHTML=`<div class="app"><header><div class="title">♠ Hold'em V2.1</div><div class="stats">${remaining()}/18 players<br>${b[0]}/${b[1]} + ${b[2]}</div></header><div class="tables">${tableHTML(G.t1,1,true)}${G.merged?'':tableHTML(G.t2,2,false)}</div><div class="panel"><div class="turn">${G.merged?'FINAL TABLE — 9 PLAYERS':turn?'YOUR TURN':'Waiting for '+(G.t1.players.find(x=>x.id===G.t1.turn)?.name||'next hand')}</div><div class="actions"><button onclick="human('fold')" ${turn?'':'disabled'}>Fold</button><button onclick="human('check')" ${turn&&!need?'':'disabled'}>Check</button><button onclick="human('call')" ${turn&&need?'':'disabled'}>${need?'Call '+fmt(need):'Check'}</button><button onclick="human('all')" ${turn?'':'disabled'}>All-in</button></div><div class="raise"><input id="raise" type="range" min="${min}" max="${Math.max(min,max)}" value="${min}" ${turn?'':'disabled'}><button onclick="humanRaise()" ${turn?'':'disabled'}>Raise</button></div><div class="info">Your stack: ${fmt(p.chips)} • Table 1: ${alive(G.t1).length} • Table 2: ${alive(G.t2).length}<br>${G.msg||''}</div></div></div>`}
render();
</script>
</body></html>
